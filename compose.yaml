services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_DB: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ledger-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 20
  dashboard:
    build: .
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      DATABASE_URL: postgresql+psycopg://ledger:${POSTGRES_PASSWORD}@db:5432/ledger
      APP_ORIGIN: http://localhost:8002
    depends_on:
      db:
        condition: service_healthy
volumes:
  ledger-db:
