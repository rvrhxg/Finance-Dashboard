[project]
name = "ledger-finance-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "pandas>=2.2,<4"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
