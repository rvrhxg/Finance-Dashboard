name: Ledger Python acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U test -d finance_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.lock -r requirements-quality.txt
      - run: python -m ruff check app tests scripts
      - run: python -m mypy
      - run: pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://test:isolated-ci-only@localhost:5432/finance_test
          PG_USE_DOCKER: '1'
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U test -d finance_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.lock -r requirements-quality.txt
      - run: python -m ruff check app tests scripts
      - run: python -m mypy
      - run: pytest -q
      - run: node --check public/app.js
      - run: docker build -t ledger-test .
      - run: python -m scripts.container_smoke
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://test:isolated-ci-only@localhost:5432/finance_test
          PG_USE_DOCKER: '1'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m scripts.browser_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ledger-screenshots
          path: screenshots/
